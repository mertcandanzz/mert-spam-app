name: Build FAP

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build FAP
        uses: flipperdevices/flipper-zero-ufbt@v1
        with:
          app: .
          target: f7
          sdk: 74.0
      
      - name: Upload FAP
        uses: actions/upload-artifact@v4
        with:
          name: mert_spam.fap
          path: build/f7/*.fap