name: Build FAP

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install uFBT
        run: |
          pip install ufbt
          ufbt install
      
      - name: Build FAP
        run: |
          ufbt build
        
      - name: Upload FAP
        uses: actions/upload-artifact@v4
        with:
          name: mert_spam.fap
          path: build/f7/*.fap